spring.application.name=registrohoras-backend
server.port=8080

# Base de datos H2 en archivo (los datos sobreviven al reinicio). Para tests se usa en memoria.
spring.datasource.url=jdbc:h2:file:./data/registrohoras;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
